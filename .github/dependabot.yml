version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major version bumps (TypeScript 7, ESLint 10, etc.) need a manual
      # compatibility check against Next.js; don't open PRs for them.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
